<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project: Landing Page</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <main>
        <header>
            <div class="upperHeader">
                <div class="logo"><p>Header Logo</p></div>
                <div class="headerNav">
                    <ul>
                        <li>header link one</li>
                        <li>header link two</li>
                        <li>header link three</li>
                    </ul>
                </div>
            </div>
            <div class="lowerHeader">
                <div class="lowerHeaderLeft">
                    <h1>This website is awesome</h1>
                    <p>This website has some subtext that goes here under the main title. It's a smaller font and the color is lower contrast</p>
                </div>
                <div class="lowerHeaderRight"></div>
            </div>
        </header>
        <div class="panels">
            <div class="upperPanel">
                <div class="upperPanelHeader"></div>
                <div class="upperPanelCards"></div>
            </div>
            <div class="middlePanel">
                <div class="midPanelQuote"></div>
                <div class="midPanelAuthor"></div>
            </div>
            <div class="lowerPanel">
                <div class="callToActionBox">
                    <div class="callText"></div>
                    <button type="button"></button>
                </div>
            </div>
        </div>
        <footer></footer>
    </main>    
</body>
</html>
